name: DSA Growth Garden

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run DSA script
        run: node index.js

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the repository owner's GitHub-provided noreply address
          # so automated commits are attributed to the owner.
          OWNER_EMAIL=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}" \
            | jq -r '.id as $id | "\($id)+\(.login)@users.noreply.github.com"')

          git config user.name "${{ github.repository_owner }}"
          git config user.email "$OWNER_EMAIL"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "🌱 Update DSA problem"
          git push
